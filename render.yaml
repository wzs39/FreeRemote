# Render Blueprint —— 把本文件放进 Git 仓库根目录后，
# 在 Render 控制台 New -> Blueprint -> 关联仓库，即可一键部署中继。
# 部署后自动获得 https://<服务名>.onrender.com 的免费 HTTPS（wss 自动可用）。
services:
  - type: web
    name: freeremote-relay
    runtime: python
    plan: free
    region: singapore          # 可选：singapore / frankfurt / frankfurt... 越近越好
    buildCommand: pip install -r requirements-relay.txt
    startCommand: python relay.py --port $PORT --xf-trusted
    healthCheckPath: /mode      # 返回 {"mode":"relay"}，作为健康检查/防休眠
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"