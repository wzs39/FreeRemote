<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10131c">
<link rel="manifest" href="/manifest.json">
<title>FreeRemote 远程控制 v2.3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0d0f14; color: #e6e9ef;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overscroll-behavior: none; }
  body { display: grid; height: 100%;
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top" "stage" "side"; }
  #topbar { grid-area: top; }
  #stage { grid-area: stage; }
  #side { grid-area: side; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

  /* 横屏：监看区占左侧，控制/键盘/文件集成到右侧面板，拇指更好操作 */
  @media (orientation: landscape) {
    body { grid-template-columns: 1fr minmax(320px, 40vw);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "top top" "stage side"; }
    #side { border-left: 1px solid #232936; }
  }

  /* 顶部状态栏 */
  #topbar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; background: #14171f; border-bottom: 1px solid #232936;
    font-size: 13px; }
  #topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: #f0b429; flex: none; }
  #topbar .dot.ok { background: #2ecc71; }
  #topbar .dot.bad { background: #e74c3c; }
  #topbar .spacer { flex: 1; }
  #b-doctor, #b-files, #b-set, #b-wake { border: 1px solid #232936; background: #1d222e; color: #9aa4b8;
    min-width: 40px; min-height: 40px; padding: 0 9px; font-size: 17px; border-radius: 9px;
    cursor: pointer; flex: none; }
  #b-set:active, #b-files:active, #b-doctor:active, #b-wake:active { background: #2b6df6; color: #fff; }
  .ver { font-size: 10px; color: #555d6e; flex: none; }
  /* 窄屏（手机竖屏）：进一步压缩顶栏，把空间留给画面 */
  @media (max-width: 560px) {
    #topbar { gap: 5px; padding: 5px 6px; }
    #topbar #res, #topbar .ver { display: none; }
    #b-doctor, #b-files, #b-set { min-width: 36px; min-height: 36px; padding: 0 7px; }
    #qseg button { padding: 5px 7px; font-size: 11px; }
  }

  /* 文件互传面板 */
  #filepanel { flex: 0 0 auto; background: #14171f; border-top: 1px solid #232936;
    padding: 8px; display: none; max-height: 45vh; flex-direction: column; }
  #filepanel.show { display: flex; }
  .fp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .fp-head button { padding: 7px 12px; border: 1px solid #232936; border-radius: 8px;
    background: #1d222e; color: #e6e9ef; font-size: 13px; flex: none; }
  .fp-path { flex: 1; min-width: 0; font-size: 12px; color: #9aa4b8;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fp-list { flex: 1; overflow-y: auto; margin-bottom: 8px; }
  .fp-row { display: flex; align-items: center; gap: 8px; padding: 12px 8px;
    border-bottom: 1px solid #1a1f2b; font-size: 14px; cursor: pointer; touch-action: manipulation; }
  .fp-row:active { background: #1d222e; }
  .fp-size { margin-left: auto; color: #9aa4b8; font-size: 12px; flex: none; }
  .fp-msg { font-size: 12px; color: #9aa4b8; padding: 8px 6px; }
  .fp-err { font-size: 12px; color: #e74c3c; padding: 8px 6px; }
  .fp-up2 { display: flex; gap: 8px; align-items: center; }
  #fp-input { flex: 1; min-width: 0; font-size: 12px; color: #9aa4b8; }
  #fp-send { padding: 9px 16px; border: 0; border-radius: 8px; background: #2b6df6;
    color: #fff; font-size: 14px; }
  #fp-progress { display: flex; align-items: center; gap: 8px; margin-top: 8px;
    font-size: 12px; color: #9aa4b8; }
  #fp-progress[hidden] { display: none; }
  #fp-bar { flex: 1; height: 8px; border-radius: 4px; background: #1d222e; overflow: hidden; }
  #fp-bar i { display: block; height: 100%; width: 0%; background: #2b6df6; border-radius: 4px; }
  #fp-name { max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: flex; background: #1d222e; border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: #9aa4b8; padding: 5px 9px;
    font-size: 12px; cursor: pointer; }
  .seg button.on { background: #2b6df6; color: #fff; }

  /* 屏幕监看区 */
  #stage { flex: 1 1 auto; position: relative; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0d0f14; touch-action: none; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 100%; display: flex;
    align-items: center; justify-content: center; }
  #screen { max-width: 100%; max-height: 100%; object-fit: contain;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  #vwrap { position: relative; display: none; line-height: 0; }
  #vwrap.show { display: block; }
  #vcanvas { display: block; touch-action: none; }
  #ccursor { position: absolute; left: 0; top: 0; pointer-events: none; }
  /* 捏合缩放：对监看视图整体做 CSS 变换（transform 不触发重排/重绘流） */
  #zoombox { will-change: transform; transform-origin: 50% 50%; }
  #zoomhint { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 47;
    background: rgba(20,23,31,.88); color: #bcd0ff; font-size: 12px; padding: 6px 12px;
    border-radius: 14px; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #zoomhint.show { opacity: 1; }
  #frozen { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 46;
    background: rgba(120,40,20,.92); color: #ffe3d2; font-size: 12px; padding: 6px 12px;
    border-radius: 14px; pointer-events: none; max-width: 86vw; }
  /* 画面初始大小模式：铺宽/铺满时允许画面溢出容器（配合平移查看） */
  #zoombox.fit-width #screen { max-width: none; max-height: 100%; width: 100vw; object-fit: fill; }
  #zoombox.fit-width #vwrap { width: 100vw; }
  #zoombox.fit-width #vcanvas { width: 100vw !important; height: auto !important; }
  #zoombox.fit-full #screen { max-width: none; max-height: none; width: 100vw; height: 100vh; object-fit: fill; }
  #zoombox.fit-full #vwrap { width: 100vw; height: 100vh; }
  #zoombox.fit-full #vcanvas { width: 100vw !important; height: 100vh !important; }
  #zoombox.fit-full, #zoombox.fit-width { overflow: visible; }

  /* 底部工具栏 */
  #toolbar { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: #14171f;
    border-top: 1px solid #232936; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .row button { min-width: 0; min-height: 58px; padding: 8px 4px; border: 1px solid #232936;
    border-radius: 12px; background: #1d222e; color: #e6e9ef; font-size: 16px; font-weight: 500;
    cursor: pointer; touch-action: manipulation; }
  .row button:active { background: #2b6df6; }
  .row button.mod.on { background: #2b6df6; border-color: #2b6df6; }
  .row button.warn:active { background: #c0392b; }

  /* 虚拟键盘面板 */
  #kbpanel { flex: 0 0 auto; background: #14171f; border-top: 1px solid #232936;
    padding: 8px; display: none; }
  #kbpanel.show { display: flex; flex-direction: column; gap: 6px; }
  #kbline { display: flex; gap: 8px; }
  #kb-input { flex: 1 1 auto; min-width: 0; min-height: 54px; padding: 12px; border-radius: 10px;
    border: 2px solid #2b6df6; background: #1d222e; color: #fff; font-size: 18px; }
  #kbline button { flex: 0 0 auto; min-width: 84px; min-height: 54px; border-radius: 10px; border: 0;
    background: #2b6df6; color: #fff; font-size: 17px; }
  #kbkeys, #kbcombo { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  #kbcombo { grid-template-columns: repeat(3, 1fr); }
  #kbkeys button, #kbcombo button { min-height: 54px; border: 1px solid #232936; border-radius: 10px;
    background: #1d222e; color: #e6e9ef; font-size: 16px; font-weight: 500; cursor: pointer;
    touch-action: manipulation; }
  #kbkeys button:active, #kbcombo button:active { background: #2b6df6; }
  #kbcombo button { color: #bcd0ff; }
  @media (orientation: landscape) {
    #kbkeys { grid-template-columns: repeat(4, 1fr); }
    #kbcombo { grid-template-columns: repeat(5, 1fr); }
  }

  /* 单手模式：工具栏贴底覆盖，拇指更好够到 */
  body.onehand #toolbar { position: fixed; left: 8px; right: 8px;
    bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 45;
    background: rgba(20,23,31,.97); border: 1px solid #2b6df6; border-radius: 14px;
    box-shadow: 0 6px 22px rgba(0,0,0,.5); }
  body.onehand #wrap { margin-bottom: 148px; }
  body.onehand #filepanel { padding-bottom: 148px; }
  body.onehand #kbpanel { padding-bottom: 148px; }

  /* 大屏模式：隐藏顶栏与侧栏，监看区铺满全屏，控制钮收进悬浮条 */
  body.big #topbar { display: none; }
  body.big { grid-template-columns: 1fr !important;
    grid-template-rows: minmax(0, 1fr) !important;
    grid-template-areas: "stage" !important; }
  /* #side 隐藏自身但让子元素（toolbar/kbpanel/filepanel）继续渲染为悬浮层 */
  body.big #side { display: contents; }
  body.big #toolbar { position: fixed; left: auto; bottom: auto;
    right: 8px; top: 8px; z-index: 45; width: 158px;
    flex-direction: column; gap: 6px; padding: 8px 6px; touch-action: none;
    background: rgba(20,23,31,.92); border: 1px solid #232936; border-radius: 14px;
    box-shadow: 0 6px 22px rgba(0,0,0,.5); }
  body.big #toolbar .row { gap: 6px; }
  body.big #toolbar button { min-height: 46px; font-size: 13px; padding: 6px 2px; }
  body.big #kbpanel { position: fixed; left: 8px; right: 174px; top: 8px; z-index: 46;
    max-height: 60vh; overflow-y: auto; background: rgba(20,23,31,.97);
    border: 1px solid #232936; border-radius: 14px; }
  body.big #filepanel { position: fixed; left: 8px; right: 174px; top: 8px; z-index: 46;
    max-height: 60vh; background: rgba(20,23,31,.97); border: 1px solid #232936;
    border-radius: 14px; }
  /* 大屏悬浮回主界面按钮 */
  #big-exit { position: fixed; left: 8px; bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 46; padding: 10px 16px; border: 1px solid #2b6df6; border-radius: 12px;
    background: rgba(20,23,31,.92); color: #bcd0ff; font-size: 13px; display: none; }
  body.big #big-exit { display: block; }

  /* 设置面板 */
  #setpanel { position: fixed; inset: 0; z-index: 55; background: rgba(10,12,16,.92);
    display: flex; align-items: center; justify-content: center; }
  #setpanel[hidden] { display: none; }
  #setpanel .box { width: min(340px, 90vw); background: #161a23; border: 1px solid #232936;
    border-radius: 14px; padding: 20px; }
  #setpanel h2 { font-size: 17px; margin-bottom: 14px; }
  #setpanel .set-row { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 14px; font-size: 14px; }
  #setpanel .seg button { min-height: 38px; padding: 0 14px; border: 0; background: transparent;
    color: #9aa4b8; font-size: 14px; cursor: pointer; }
  #setpanel .seg button.on { background: #2b6df6; color: #fff; }
  #setpanel .toggle { min-width: 72px; min-height: 40px; border-radius: 10px; border: 1px solid #232936;
    background: #1d222e; color: #9aa4b8; font-size: 14px; cursor: pointer; }
  #setpanel .toggle.on { background: #2b6df6; color: #fff; border-color: #2b6df6; }
  #set-close { width: 100%; padding: 12px; border: 0; border-radius: 10px;
    background: #2b6df6; color: #fff; font-size: 15px; margin-top: 4px; }

  /* 横屏提示 */
  #rot { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); z-index: 60;
    background: rgba(245,179,41,.95); color: #1a1a1a; padding: 10px 18px; border-radius: 22px;
    font-size: 14px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.45); cursor: pointer; }
  #rot[hidden] { display: none; }

  /* 口令输入遮罩 */
  #auth { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,16,.92);
    display: flex; align-items: center; justify-content: center; }
  #auth[hidden] { display: none; }
  #auth .box { width: min(320px, 86vw); background: #161a23; border: 1px solid #232936;
    border-radius: 14px; padding: 22px; }
  #auth h2 { font-size: 17px; margin-bottom: 6px; }
  #auth p { font-size: 12px; color: #9aa4b8; margin-bottom: 12px; }
  #auth input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2b6df6;
    background: #1d222e; color: #fff; font-size: 15px; margin-bottom: 10px; }
  #auth button { width: 100%; padding: 11px; border: 0; border-radius: 8px;
    background: #2b6df6; color: #fff; font-size: 15px; }
</style>
</head>
<body>

<div id="topbar">
  <span class="dot" id="dot"></span>
  <span id="status">连接中…</span>
  <span class="spacer"></span>
  <span id="res"></span>
  <span class="ver">v2.3</span>
  <button id="b-wake" title="远程唤醒电脑" hidden>⚡</button>
  <button id="b-doctor" title="自检">🩺</button>
  <button id="b-files" title="文件互传">📁</button>
  <button id="b-set" title="操作设置">⚙</button>
  <span class="seg" id="qseg">
    <button data-q="low">流畅</button>
    <button data-q="mid" class="on">均衡</button>
    <button data-q="high">高清</button>
  </span>
</div>

<div id="stage">
  <div id="zoombox">
    <div id="wrap">
      <img id="screen" alt="远程桌面" draggable="false">
      <div id="vwrap">
        <canvas id="vcanvas"></canvas>
        <canvas id="ccursor"></canvas>
      </div>
    </div>
  </div>
</div>
<div id="frozen" hidden>⚠ 画面已停止更新 —— 电脑端可能在锁屏/系统繁忙，链路正常，恢复后自动消失</div>
<div id="zoomhint" hidden>已放大 · 双击空白处复位</div>

<div id="side">

<div id="toolbar">
  <div class="row">
    <button id="b-left">左键</button>
    <button id="b-right">右键</button>
    <button id="b-mid">中键</button>
    <button id="b-wup">滚↑</button>
    <button id="b-wdown">滚↓</button>
    <button id="b-fs">全屏</button>
  </div>
  <div class="row">
    <button id="b-ctrl" class="mod" data-mod="ctrl">Ctrl</button>
    <button id="b-alt" class="mod" data-mod="alt">Alt</button>
    <button id="b-shift" class="mod" data-mod="shift">Shift</button>
    <button id="b-win" class="mod" data-mod="win">Win</button>
    <button id="b-kb">⌨ 键盘</button>
    <button id="b-cad" class="warn">CtrlAltDel</button>
    <button id="b-unstick" class="warn">解锁键盘</button>
  </div>
</div>  <div id="kbpanel">
  <div id="kbline">
    <input id="kb-input" placeholder="英文/符号直接打字，中文输入法组词后点发送" enterkeyhint="send">
    <button id="kb-send">发送</button>
  </div>
  <div id="kbkeys"></div>
  <div id="kbcombo"></div>
</div>

<div id="filepanel">
  <div class="fp-head">
    <button id="fp-up">↑ 上级</button>
    <span class="fp-path" id="fp-path"></span>
    <button id="fp-close">✕</button>
  </div>
  <div class="fp-list" id="fp-list"></div>
  <div class="fp-up2">
    <input type="file" id="fp-input">
    <button id="fp-send">上传</button>
  </div>
  <div id="fp-progress" hidden>
    <div id="fp-bar"><i></i></div>
    <span id="fp-pct">0%</span>
    <span id="fp-name"></span>
  </div>
</div>
</div>

<div id="rot" hidden>↻ 建议横屏使用，控制更顺手</div>

<button id="big-exit">⛶ 退出大屏</button>

<div id="setpanel" hidden>
  <div class="box">
    <h2>操作设置</h2>
    <div class="set-row"><span>鼠标灵敏度</span>
      <span class="seg" id="set-sens">
        <button data-v="0.4">精准</button>
        <button data-v="1" class="on">标准</button>
        <button data-v="1.8">灵敏</button>
      </span></div>
    <div class="set-row"><span>双指滚轮速度</span>
      <span class="seg" id="set-wheel">
        <button data-v="0.5">慢</button>
        <button data-v="1" class="on">中</button>
        <button data-v="1.8">快</button>
      </span></div>
    <div class="set-row"><span>画面分辨率</span>
      <span class="seg" id="set-res">
        <button data-v="auto">自动</button>
        <button data-v="0.25">省流</button>
        <button data-v="0.6">标准</button>
        <button data-v="1">清晰</button>
        <button data-v="1.5">超清</button>
      </span></div>
    <div class="set-row"><span>画面初始大小</span>
      <span class="seg" id="set-fit">
        <button data-v="contain" class="on">适应</button>
        <button data-v="width">铺宽</button>
        <button data-v="full">铺满</button>
      </span></div>
    <div class="set-row"><span>单手模式（工具栏贴底）</span>
      <button id="set-onehand" class="toggle">关</button></div>
    <div class="set-row"><span>大屏模式（全屏监看+悬浮控制）</span>
      <button id="set-big" class="toggle">关</button></div>
    <button id="set-close">完成</button>
  </div>
</div>

<div id="auth" hidden>
  <div class="box">
    <h2 id="auth-title">需要访问口令</h2>
    <p id="auth-desc">在电脑上运行 server.py 时，终端会打印带 token 的访问链接，直接打开那个链接即可。</p>
    <input id="auth-input-id" placeholder="识别码（远程模式）" autocomplete="off" hidden>
    <input id="auth-input" placeholder="口令 / token" autocomplete="off">
    <button id="auth-go">连接</button>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
